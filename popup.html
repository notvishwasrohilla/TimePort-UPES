<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">🚀</span>
                <h1>TimePort</h1>
            </div>
            <div class="auth-container">
                <div id="auth-status" class="auth-pill logged-out">Checking...</div>
                <button id="auth-action-btn" class="auth-btn">Log In</button>
            </div>
        </header>

        <main>
            <div class="status-card">
                <div class="status-header">
                    <div class="pulse-ring"></div>
                    <h2>Watchman Active</h2>
                </div>
                <p class="subtitle">Scraping UPES Portal</p>
            </div>

            <div class="info-row">
                <span class="label">Last Synced:</span>
                <span class="value" id="last-sync-time">Never</span>
            </div>
            
            <div class="info-row">
                <span class="label">Detected Cohort:</span>
                <span class="value" id="cohort-display">Awaiting...</span>
            </div>

            <button id="force-sync-btn" class="primary-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.94 4.06"/></svg>
                Force Sync Now
            </button>

            <div id="sync-report" class="sync-report"></div>

            <div class="schedule-section">
                <h3>Today's Mission</h3>
                <div id="schedule-container" class="schedule-container">
                    <p class="empty-state">No classes found for today.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
